# Read-only check that README.md agrees with the English and Finnish
# JSP-Product catalogues (solution and group counts, language parity, links).
# It only reports in the job summary; it never edits README.md.
# Documentation: https://github.com/JSP-IT-Solutions-Group/.github/blob/main/docs/profile-consistency.md

name: Profile consistency

on:
  pull_request:
    paths: ["README.md", ".github/workflows/profile-consistency.yml"]
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-consistency:
    permissions:
      contents: read
    # Pinned to the commit of tag profile-consistency-v1.2.0 in
    # JSP-IT-Solutions-Group/.github. Update both refs together when upgrading.
    uses: JSP-IT-Solutions-Group/.github/.github/workflows/profile-consistency.yml@f1bf8c5c5ebc47425ec75ac79f005e842dda7b11 # profile-consistency-v1.2.0
    with:
      counts-profiles: README.md
      tooling-ref: f1bf8c5c5ebc47425ec75ac79f005e842dda7b11
