# Weekly sync of README.md with the English JSP-Product catalogue. Every
# Monday, and on demand, it opens or updates a pull request that updates the
# solution and group counts and the generated solution list. A person reviews
# and merges the pull request; nothing is merged automatically.
# Documentation: https://github.com/JSP-IT-Solutions-Group/.github/blob/main/docs/profile-consistency.md

name: JSP-Product catalogue sync

on:
  schedule:
    - cron: "5 6 * * 1" # Mondays 06:05 UTC, before the 06:23 consistency check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    # Pinned to the commit of tag profile-consistency-v1.2.0 in
    # JSP-IT-Solutions-Group/.github. Update both refs together when upgrading.
    uses: JSP-IT-Solutions-Group/.github/.github/workflows/profile-consistency-sync.yml@f1bf8c5c5ebc47425ec75ac79f005e842dda7b11 # profile-consistency-v1.2.0
    with:
      profile-path: README.md
      tooling-ref: f1bf8c5c5ebc47425ec75ac79f005e842dda7b11
