# Weekly sync of README.md with the English JSP-Product catalogue and JSP-IT's
# published open-source projects. Every Monday, and on demand, it opens or
# updates a pull request that updates the solution and group counts, the
# generated solution list and the generated project list. A person reviews
# and merges the pull request; nothing is merged automatically.
# Documentation: https://github.com/JSP-IT-Solutions-Group/.github/blob/main/docs/profile-consistency.md

name: Profile sync (catalogue and projects)

on:
  # Several runs on Mondays: GitHub-hosted runners are often served the site's
  # bot-protection page, and each run gets a fresh runner. Runs after a
  # successful one change nothing (the open sync pull request is just kept).
  schedule:
    - cron: "5 6 * * 1" # Mondays 06:05 UTC
    - cron: "5 9 * * 1" # Mondays 09:05 UTC
    - cron: "5 12 * * 1" # Mondays 12:05 UTC
    - cron: "5 15 * * 1" # Mondays 15:05 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    # Pinned to the commit of tag profile-consistency-v1.4.0 in
    # JSP-IT-Solutions-Group/.github. Update both refs together when upgrading.
    uses: JSP-IT-Solutions-Group/.github/.github/workflows/profile-consistency-sync.yml@fa344953fae08b7d20139aab0b08aa385a43af2a # profile-consistency-v1.4.0
    with:
      profile-path: README.md
      # Also sync the "Published Open-Source Projects" list from JSP-IT's public repositories.
      projects-owner: JSP-IT
      projects-format: list
      tooling-ref: fa344953fae08b7d20139aab0b08aa385a43af2a
      # Retries within one run reuse the same runner, so keep them short;
      # the extra scheduled runs above give the real second chances.
      attempts: 2
      retry-delay-seconds: 30
